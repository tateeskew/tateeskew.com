{{ define "main" }}
<!-- Full-viewport hero with background image -->
<section class="hero-fullscreen" style="background-image: url('{{ "images/tate_background-2.jpg" | relURL }}');">
  <div class="hero-overlay"></div>
  <div class="hero-inner">
    <p class="hero-slogan">{{ with .Params.subtitle }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}</p>
    <div class="hero-accent-bar"></div>
    <h1 class="hero-title">TATE ESKEW</h1>
  </div>
</section>

<div class="container fade-in">
  {{ with .Content }}
  <section class="fade-in fade-in-delay-1">
    {{ . }}
  </section>
  {{ end }}




  <!-- Contact -->
  <div id="contact" class="section-divider fade-in fade-in-delay-4">
    <span>Get in Touch</span>
  </div>
  <section class="contact-section fade-in fade-in-delay-4">
    <h3>Send a Missive</h3>
    <p style="color: var(--text-secondary); font-size: 0.95rem;">For bookings, collaboration, or just to say hello.</p>
    <a id="contact-link" class="contact-link" href="#" onclick="return false;">Enable JS to see email</a>
    <noscript><p style="color: var(--text-faint); font-size: 0.8rem; margin-top: var(--space-sm);">Enable JavaScript to see email address</p></noscript>
  </section>
</div>
{{ end }}
